<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Txn AI Classifier Dashboard</title>
  <!-- Anime.js for smooth cool animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <!-- Tailwind CSS for sleek dark theme styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .bar-fill {
      transform-origin: left;
      transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pulse-glow {
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body class="min-h-screen p-6 md:p-10 flex flex-col items-center justify-center">

  <!-- Main Container -->
  <div class="max-w-6xl w-full space-y-6">

    <!-- Header Section -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center glass-card p-6 rounded-2xl">
      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-blue-400">Production Model Analytics</span>
        <h1 class="text-2xl md:text-3xl font-extrabold text-white mt-1">Transaction AI Classifier</h1>
      </div>
      
      <!-- Input Controls -->
      <div class="mt-4 md:mt-0 flex flex-wrap gap-3 items-center">
        <select id="sampleSelect" class="bg-gray-800 text-white border border-gray-700 px-4 py-2.5 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <option value="1">Zomato Food Order</option>
          <option value="2">Monthly Salary Credit</option>
          <option value="3">Netflix Subscription</option>
          <option value="4">HDFC Home Loan EMI</option>
          <option value="5">Ambiguous Transfer (Review Needed)</option>
        </select>
        
        <button id="reAnimateBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-5 py-2.5 rounded-xl text-sm transition-all shadow-lg hover:shadow-blue-500/25 active:scale-95">
          ⚡ Re-Animate
        </button>
      </div>
    </div>

    <!-- Cleaned Text & Banner Card -->
    <div class="glass-card p-5 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4 border-l-4 border-blue-500">
      <div>
        <p class="text-xs font-semibold text-gray-400">MODEL INPUT CLEANING PIPELINE</p>
        <p class="text-lg font-mono font-bold text-blue-300 mt-0.5" id="cleanedTextDisplay">
          "ZOMATO BANGALORE ORDER"
        </p>
      </div>
      <div id="statusBadge" class="px-4 py-2 rounded-full text-xs font-bold tracking-wide uppercase">
        Checking...
      </div>
    </div>

    <!-- Charts Grid (2 Cool Animated Charts) -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-6">

      <!-- Chart 1: Animated Horizontal Category Probabilities -->
      <div class="md:col-span-7 glass-card p-6 rounded-2xl flex flex-col justify-between">
        <div>
          <h3 class="text-lg font-bold text-white mb-1">Top Category Probabilities</h3>
          <p class="text-xs text-gray-400 mb-6">Class distributions from Logistic Regression pipeline</p>
        </div>

        <div id="barsContainer" class="space-y-4">
          <!-- Animated Bar Items Injected via JS -->
        </div>
      </div>

      <!-- Chart 2: Cool Animated Radial Gauge -->
      <div class="md:col-span-5 glass-card p-6 rounded-2xl flex flex-col items-center justify-between">
        <div class="w-full text-left">
          <h3 class="text-lg font-bold text-white mb-1">Model Confidence Meter</h3>
          <p class="text-xs text-gray-400 mb-4">Threshold baseline set at 72.0%</p>
        </div>

        <!-- Gauge SVG -->
        <div class="relative w-64 h-64 flex items-center justify-center my-2">
          <svg class="w-full h-full transform -rotate-90" viewBox="0 0 120 120">
            <!-- Background Ring -->
            <circle cx="60" cy="60" r="50" stroke="#1f2937" stroke-width="10" fill="none" />
            <!-- Threshold Markers -->
            <circle cx="60" cy="60" r="50" stroke="#374151" stroke-width="10" fill="none" stroke-dasharray="226 88" />
            <!-- Animated Arc Fill -->
            <circle id="gaugeArc" cx="60" cy="60" r="50" stroke="#3b82f6" stroke-width="10" fill="none" 
                    stroke-dasharray="314" stroke-dashoffset="314" stroke-linecap="round"/>
          </svg>
          
          <!-- Gauge Inner Animated Value -->
          <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span id="gaugeValue" class="text-4xl font-extrabold text-white tracking-tight">0%</span>
            <span id="gaugeLabel" class="text-xs font-semibold text-gray-400 mt-1">CONFIDENCE</span>
          </div>
        </div>

        <!-- Threshold Indicator -->
        <div class="w-full bg-gray-900/60 p-3 rounded-xl border border-gray-800 text-xs flex justify-between items-center text-gray-400">
          <span>Threshold: <strong class="text-white">72%</strong></span>
          <span id="reviewFlagText" class="font-bold">--</span>
        </div>
      </div>

    </div>
  </div>

  <!-- JavaScript Code for High Performance Animations -->
  <script>
    // Sample Transaction Data Matching Python Model Structure
    const samples = {
      "1": {
        cleanedText: "ZOMATO BANGALORE ORDER",
        confidence: 0.88,
        needsReview: false,
        topK: [
          { category: "Food & Dining", prob: 0.88 },
          { category: "Groceries", prob: 0.06 },
          { category: "Shopping", prob: 0.03 },
          { category: "Personal Transfer", prob: 0.02 },
          { category: "Subscriptions", prob: 0.01 }
        ]
      },
      "2": {
        cleanedText: "SALARY CREDIT ACME CORP",
        confidence: 0.95,
        needsReview: false,
        topK: [
          { category: "Salary/Income", prob: 0.95 },
          { category: "Personal Transfer", prob: 0.03 },
          { category: "Investments", prob: 0.01 },
          { category: "Uncategorized", prob: 0.006 },
          { category: "Loan EMI", prob: 0.004 }
        ]
      },
      "3": {
        cleanedText: "NETFLIX DIGITAL MEDIA",
        confidence: 0.81,
        needsReview: false,
        topK: [
          { category: "Subscriptions", prob: 0.81 },
          { category: "Entertainment", prob: 0.12 },
          { category: "Bills & Utilities", prob: 0.04 },
          { category: "Shopping", prob: 0.02 },
          { category: "Food & Dining", prob: 0.01 }
        ]
      },
      "4": {
        cleanedText: "HDFC BANK HOME LOAN EMI",
        confidence: 0.92,
        needsReview: false,
        topK: [
          { category: "Loan EMI", prob: 0.92 },
          { category: "Bills & Utilities", prob: 0.05 },
          { category: "Personal Transfer", prob: 0.02 },
          { category: "Credit Card Payment", prob: 0.007 },
          { category: "Investments", prob: 0.003 }
        ]
      },
      "5": {
        cleanedText: "AMAZON PAY INDIA PVT LTD",
        confidence: 0.58,
        needsReview: true, // Needs Review Trigger (< 72%)
        topK: [
          { category: "Shopping", prob: 0.58 },
          { category: "Bills & Utilities", prob: 0.22 },
          { category: "Personal Transfer", prob: 0.11 },
          { category: "Food & Dining", prob: 0.06 },
          { category: "Entertainment", prob: 0.03 }
        ]
      }
    };

    function renderDashboard(sampleId) {
      const data = samples[sampleId];

      // 1. Update Cleaned Text Banner
      document.getElementById("cleanedTextDisplay").textContent = `"${data.cleanedText}"`;

      // 2. Update Status Badge
      const badge = document.getElementById("statusBadge");
      const reviewText = document.getElementById("reviewFlagText");

      if (data.needsReview) {
        badge.className = "px-4 py-2 rounded-full text-xs font-bold tracking-wide uppercase bg-red-500/20 text-red-400 border border-red-500/30";
        badge.textContent = "⚠️ Needs Review (< 72%)";
        reviewText.textContent = "ACTION: MANUAL REVIEW";
        reviewText.className = "font-bold text-red-400";
      } else {
        badge.className = "px-4 py-2 rounded-full text-xs font-bold tracking-wide uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        badge.textContent = "✅ Auto-Categorized";
        reviewText.textContent = "ACTION: AUTO APPROVED";
        reviewText.className = "font-bold text-emerald-400";
      }

      // 3. Render & Animate Horizontal Category Bars
      const barsContainer = document.getElementById("barsContainer");
      barsContainer.innerHTML = "";

      data.topK.forEach((item, index) => {
        const isTop = index === 0;
        const barColor = isTop 
          ? (data.needsReview ? 'bg-gradient-to-r from-amber-500 to-orange-500' : 'bg-gradient-to-r from-blue-600 to-indigo-500') 
          : 'bg-gray-700';

        const rowHTML = `
          <div class="space-y-1">
            <div class="flex justify-between text-xs font-semibold">
              <span class="${isTop ? 'text-white font-bold' : 'text-gray-400'}">${item.category}</span>
              <span class="${isTop ? 'text-blue-400 font-bold' : 'text-gray-400'}" id="prob-val-${index}">0.0%</span>
            </div>
            <div class="w-full bg-gray-900 rounded-full h-3 overflow-hidden p-0.5 border border-gray-800">
              <div id="bar-fill-${index}" class="${barColor} h-full rounded-full bar-fill" style="width: 0%"></div>
            </div>
          </div>
        `;
        barsContainer.insertAdjacentHTML('beforeend', rowHTML);

        // Animate Bar Width
        setTimeout(() => {
          document.getElementById(`bar-fill-${index}`).style.width = `${item.prob * 100}%`;
        }, 50 * index);

        // Animate Number Counter
        let obj = { val: 0 };
        anime({
          targets: obj,
          val: item.prob * 100,
          round: 10,
          easing: 'easeOutQuad',
          duration: 900,
          update: function() {
            document.getElementById(`prob-val-${index}`).textContent = obj.val.toFixed(1) + '%';
          }
        });
      });

      // 4. Animate Gauge Arc Sweep & Center Counter
      const maxDash = 314;
      const targetOffset = maxDash - (maxDash * data.confidence);
      const gaugeArc = document.getElementById("gaugeArc");

      // Set Arc Color based on confidence
      gaugeArc.setAttribute('stroke', data.needsReview ? '#f59e0b' : '#3b82f6');

      anime({
        targets: gaugeArc,
        strokeDashoffset: [maxDash, targetOffset],
        easing: 'cubicBezier(0.34, 1.56, 0.64, 1)',
        duration: 1200
      });

      // Gauge Text Counter
      let gaugeObj = { val: 0 };
      anime({
        targets: gaugeObj,
        val: data.confidence * 100,
        round: 1,
        easing: 'easeOutQuad',
        duration: 1100,
        update: function() {
          document.getElementById("gaugeValue").textContent = Math.round(gaugeObj.val) + '%';
        }
      });
    }

    // Event Listeners
    document.getElementById("sampleSelect").addEventListener("change", (e) => {
      renderDashboard(e.target.value);
    });

    document.getElementById("reAnimateBtn").addEventListener("click", () => {
      const currentVal = document.getElementById("sampleSelect").value;
      renderDashboard(currentVal);
    });

    // Initial Load Animation
    renderDashboard("1");
  </script>
</body>
</html>
